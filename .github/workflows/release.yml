name: Build and publish release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out tag
        uses: actions/checkout@v4

      - name: Build release tarball (secrets excluded)
        run: |
          tar --exclude='.git' --exclude='.env' --exclude='.env.*' \
              --exclude='keys' --exclude='*.pem' --exclude='*.key' \
              --exclude='dist' --exclude='venv' --exclude='__pycache__' \
              --exclude='node_modules' \
              --exclude='jlmai-framework-*.tar.gz' \
              -czf /tmp/jlmai-framework-${{ github.ref_name }}-release.tar.gz .
          mv /tmp/jlmai-framework-${{ github.ref_name }}-release.tar.gz .
          sha256sum jlmai-framework-${{ github.ref_name }}-release.tar.gz > jlmai-framework-${{ github.ref_name }}-release.tar.gz.sha256
          tar -tzf jlmai-framework-${{ github.ref_name }}-release.tar.gz

      - name: Generate provenance.json
        run: |
          cat > provenance.json <<'EOF'
          {
            "name": "JLMAI Agent Framework",
            "version": "${{ github.ref_name }}",
            "publisher": "Jessica Lynn Moss",
            "repository": "${{ github.repository }}",
            "commit": "${{ github.sha }}",
            "built_by": "GitHub Actions",
            "tarball_sha256_file": "jlmai-framework-${{ github.ref_name }}-release.tar.gz.sha256"
          }
          EOF
          cat provenance.json

      - name: Write release notes
        run: |
          cat > RELEASE_NOTES.md <<'EOF'
          # JLMAI Framework v2.0.0 (Setup Files)

          This v2.0.0 release contains the setup and automation files for the
          JLMAI Agent Framework repository. It does NOT contain the framework
          application code itself, which has not been pushed to this repository
          yet.

          ## Contents

          * `src/monetization/production_gateway.py` — Revenue gateway API.
            Records dispatches; performs NO on-chain settlement.
            Defaults to Base Sepolia testnet (chain 84532).
          * `jlmai-v2.0.0-release.sh` — Local release helper script.
          * `.github/workflows/release.yml` — This automation: builds the
            tarball, SHA-256, and provenance.json on tag push.
          * `jlmai-vault-lockdown-safe.sh` — Dry-run-by-default vault
            permissions script. Never touches network/firewall.
          * `health_check.sh` — Local health check helper.
          * `README.md` — Project readme with author attribution.

          ## Artifacts

          * `jlmai-framework-v2.0.0-release.tar.gz`
          * `jlmai-framework-v2.0.0-release.tar.gz.sha256`
          * `provenance.json`
          EOF

      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ github.ref_name }}" >/dev/null 2>&1; then
            gh release upload "${{ github.ref_name }}" \
              "jlmai-framework-${{ github.ref_name }}-release.tar.gz" \
              "jlmai-framework-${{ github.ref_name }}-release.tar.gz.sha256" \
              provenance.json --clobber
            gh release edit "${{ github.ref_name }}" \
              --title "JLMAI Framework ${{ github.ref_name }}" \
              --notes-file RELEASE_NOTES.md
          else
            gh release create "${{ github.ref_name }}" \
              --title "JLMAI Framework ${{ github.ref_name }}" \
              --notes-file RELEASE_NOTES.md \
              "jlmai-framework-${{ github.ref_name }}-release.tar.gz" \
              "jlmai-framework-${{ github.ref_name }}-release.tar.gz.sha256" \
              provenance.json
          fi
