name: Payment Integration CI

on:
  pull_request:
    paths:
      - "payment-integration/**"
      - ".github/workflows/payment-integration-ci.yml"
  push:
    branches:
      - "feature/payment-integration"
    paths:
      - "payment-integration/**"
      - ".github/workflows/payment-integration-ci.yml"

permissions:
  contents: read

concurrency:
  group: payment-integration-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Payment tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    defaults:
      run:
        working-directory: payment-integration

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Verify OpenSSL
        run: openssl version

      - name: Install pytest
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest

      - name: Compile Python sources
        run: python -m compileall -q .

      - name: Run payment tests
        run: python -m pytest -q
